<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Pizza Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topo">
    <div id="inicial-topo">
        <h1>Pizza Store</h1>
        <img src="imagem/logo (1).png" alt="Logo Pizza Store">
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="promo.html">Promoções</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="login.html">Entrar</a>
        </nav>
    </div>
</header>

<main class="auth-wrapper">
    <section class="auth-card" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Criar conta</h2>
        <p class="auth-sub">Cadastre seus dados para agilizar os próximos pedidos.</p>
        <form action="login.html" method="get">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            </div>
            <button type="submit" class="btn-primario">Criar conta</button>
        </form>
        <p class="auth-rodape">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
</main>
</body>
</html>
